[project]
name = "analytics"
version = "0.1.0"
description = "An analytical portfolio exploring Olist e-commerce data using Python, PostgreSQL, and SQL queries."
readme = "README.md"
authors = [{ name = "Anas Wajeeh", email = "anooswork2004@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.5.6",
  "ipykernel>=7.4.0",
  "matplotlib>=3.11.2",
  "pandas>=3.0.6",
  "psycopg[binary]>=3.3.6",
  "python-dotenv>=1.2.4",
  "scikit-learn>=1.9.1",
  "sqlalchemy>=2.1.5",
]


[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
